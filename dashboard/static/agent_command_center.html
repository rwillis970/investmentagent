    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }

      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

        }

            (entry.compressed ? toBase64(finalBytes) : entry.data);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {

    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);

      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ec; background: none; color: #cfe3ec; cursor: pointer;\" style-hover=\"background: #cfe3ec; color: #050b12;\">Reject<\u002Fbutton>\n            <button type=\"button\" sc-camel-on-click=\"{{ closeModal }}\" style=\"font-family: 'Rajdhani', sans-serif; font-size: 13.5px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 11px 18px; border: 1px solid #2a4a58; background: none; color: #6a8798; cursor: pointer;\" style-hover=\"border-color: #6a8798; color: #cfe3ec;\">Defer to next session<\u002Fbutton>\n            <div style=\"flex: 1;\"><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 5px;\">\n              <button type=\"button\" disabled=\"{{ approveDisabled }}\" style=\"font-family: 'Rajdhani', sans-serif; font-size: 13.5px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 11px 26px; border: 1.5px solid {{ approveBorder }}; background: {{ approveBg }}; color: {{ approveFg }}; cursor: {{ approveCursor }};\">{{ approveLabel }}<\u002Fbutton>\n              <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; color: #4e6b7c;\">{{ approveHint }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"padding: 10px 24px 12px; border-top: 1px solid #123243; display: flex; justify-content: space-between; font-family: 'IBM Plex Mono', monospace; font-size: 9px; letter-spacing: 0.07em; color: #4e6b7c;\">\n            <div>SIGNED TOKEN REQUIRED · MODIFY-IN-BOUNDS VERIFIED AT SUBMIT<\u002Fdiv>\n            <div>ON SCREEN {{ elapsedLabel }} · ESC AND CLICK-OUTSIDE DISABLED<\u002Fdiv>\n          <\u002Fdiv>\n\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:900},&quot;coreLoad&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;live&quot;,&quot;resting&quot;,&quot;moderate&quot;,&quot;high&quot;,&quot;max&quot;],&quot;default&quot;:&quot;live&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Core&quot;},&quot;minDisplaySeconds&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:45,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:180,&quot;unit&quot;:&quot;s&quot;,&quot;section&quot;:&quot;Friction&quot;}}\">\nclass Component extends DCLogic {\n  state = { t: 0, open: null, sizePct: 100, limitDelta: 0, cardShownAt: 0, drawer: null,\n            api: null, apiErr: null, apiAt: null };\n\n  // The page exposes exactly two entry points to the backend poller\n  // (dashboard_bind.js). They set state and nothing else -- no DOM patching, so\n  // a re-render can never fight the poller. Both are idempotent.\n  componentDidMount() {\n    // The sample-data animation must stop the moment a poll fails: a ticking\n    // figure during an error reads as live activity. Frozen == last good render.\n    this._i = setInterval(() => this.setState(s => (s.apiErr ? null : { t: s.t + 1 })), 1000);\n    const ok = (s) => {\n      // Every section renderVals() dereferences without a guard. A document\n      // missing any of them would throw during render, so it is malformed to\n      // this page even though it is valid JSON with a good generated_at.\n      const SECTIONS = [\"data_collection\", \"materiality_screen\", \"analysis\",\n        \"reconciliation\", \"approvals\", \"improvement_loop\", \"audit\", \"performance\"];\n      const missing = (!s || typeof s !== \"object\") ? [] :\n        SECTIONS.filter(k => !s[k] || typeof s[k] !== \"object\");\n      if (!s || typeof s !== \"object\" || typeof s.generated_at !== \"string\" || missing.length) {\n        return this.setState({ api: null, apiAt: Date.now(), apiErr: { kind: \"malformed\",\n          message: missing.length\n            ? (\"/api/state document is missing: \" + missing.join(\", \"))\n            : \"/api/state returned a document this page cannot read\" } });\n      }\n      this.setState({ api: s, apiErr: null, apiAt: Date.now() });\n    };\n    const bad = (e) => this.setState({\n      api: null, apiErr: { message: (e && e.message) || \"unreachable\" }, apiAt: Date.now(),\n    });\n    window.AgentCommandCenter = { applyState: ok, applyStateError: bad };\n    this._push = () => {\n      const core = document.querySelector(\"agent-core-zones\");\n      if (core && core.setProcesses) core.setProcesses(this._procs || []);\n      if (!this._flow && window.EnergyConnectors) {\n        const layer = document.querySelector(\"#connectorLayer\");\n        if (layer) { try { this._flow = new window.EnergyConnectors(layer); } catch (err) { this._flow = null; } }\n      }\n      if (this._flow && this._loads) {\n        Object.keys(this._loads).forEach(id => this._flow.setLoad(id, this._loads[id]));\n      }\n    };\n    this._t0 = setTimeout(this._push, 400);\n  }\n  componentDidUpdate() { if (this._push) this._push(); }\n  componentWillUnmount() {\n    clearInterval(this._i);\n    clearTimeout(this._t0);\n    if (this._flow && this._flow.pause) this._flow.pause();\n    if (window.AgentCommandCenter && window.AgentCommandCenter.applyState) {\n      try { delete window.AgentCommandCenter; } catch (e) { window.AgentCommandCenter = null; }\n    }\n  }\n\n  // Any /api/state document that survives the section gate but still cannot be\n  // rendered (a section present but hollow, a key path added by a later backend)\n  // degrades to the malformed state instead of throwing. The gate above exists\n  // for its better operator message, not as the only line of defence.\n  renderVals() {\n    try {\n      return this._compute();\n    } catch (err) {\n      if (!this.state.api) return {};\n      const message = \"/api/state document could not be rendered: \"\n        + ((err && err.message) || \"unknown error\");\n      this.state.api = null;\n      this.state.apiErr = { kind: \"malformed\", message };\n      Promise.resolve().then(() => this.setState({\n        api: null, apiErr: { kind: \"malformed\", message }, apiAt: Date.now(),\n      }));\n      try { return this._compute(); } catch (e2) { return {}; }\n    }\n  }\n\n  _compute() {\n    const t = this.state.t;\n    const open = this.state.open;\n    const isOpen = open !== null && !this.state.api;\n    const minSec = this.props.minDisplaySeconds ?? 45;\n\n    // ---- live state from GET /api/state -------------------------------------\n    // A === null means no backend has spoken. In that case every figure below is\n    // SAMPLE DATA and the header pill says so; nothing on this page is allowed to\n    // present a mock number as a reading of the real system.\n    const A = this.state.api;\n    const E = this.state.apiErr;\n    const dataMode = A ? \"live\" : (E ? \"error\" : \"mock\");\n    const dataModeLabel = A ? \"LIVE \\u00b7 /api/state\"\n      : (E ? (E.kind === \"malformed\" ? \"/api/state MALFORMED\" : \"/api/state UNREACHABLE\")\n           : \"SAMPLE DATA \\u00b7 NOT WIRED\");\n    const dataModeFg = A ? \"#4ade8a\" : (E ? \"#ff6b5a\" : \"#f5b942\");\n    const dataModeBd = A ? \"#1f6b42\" : (E ? \"#7a2b22\" : \"#7a5c19\");\n    const dataModeNote = A\n      ? (\"read \" + A.generated_at.slice(11, 19) + \" UTC \\u00b7 mode \" + A.mode)\n      : (E ? E.message : \"no backend has answered; every figure below is sample data\");\n\n    // Sibling-key convention from agent/dashboard_state.py: a null value always\n    // arrives with a <field>_unavailable_reason string. Show the reason, never a\n    // substitute number.\n    const fig = (obj, key, fmt) => {\n      if (!obj) return null;\n      const v = obj[key];\n      if (v === null || v === undefined) {\n        return { v: \"UNAVAILABLE\", fg: \"#6a8798\", why: obj[key + \"_unavailable_reason\"] || \"\" };\n      }\n      return { v: fmt ? fmt(v) : String(v), fg: \"#cfe3ec\", why: \"\" };\n    };\n    const flag = (b) => ({ v: b ? \"TRUE\" : \"FALSE\", fg: b ? \"#4ade8a\" : \"#6a8798\", why: \"\" });\n    const usd = (v) => \"$\" + Number(v).toFixed(2);\n    // Config percentages are stored as fractions in some keys and whole numbers in\n    // others; normalise on display rather than guessing at the source.\n    const asPct = (v) => (Number(v) <= 1 ? (Number(v) * 100) : Number(v)).toFixed(0) + \"%\";\n\n    // In live mode there is no in-flight signal anywhere in /api/state (every\n    // per-cycle count is null + _NO_SESSION_HISTORY), so a stage reads as running\n    // only if its own enabled flag is true. Never the timer.\n    const LA = this.state.api;\n    const collecting = LA ? !!LA.data_collection.enabled : t % 14 < 9;\n    const screening = LA ? !!LA.materiality_screen.enabled : (t % 14 >= 7 && t % 14 < 11);\n    const analysing = LA ? !!LA.analysis.enabled : t % 23 < 12;\n    const reconciling = LA ? false : t % 19 < 5;\n    const syncing = LA ? false : (t % 19 >= 3 && t % 19 < 7);\n\n    const active = [collecting, screening, analysing, reconciling, syncing, false].filter(Boolean).length;\n    const waiting = LA ? (((LA.approvals || {}).pending) || []).length : 3;\n\n    // Core zones follow PROCESSING LOAD only -- approval state is deliberately\n    // absent from _procs, per the handoff's non-negotiable behaviour. Connectors\n    // do carry approval traffic, since that is flow, not load.\n    this._procs = [\n      { id: \"collect\", x: -1, y: -0.76, load: collecting ? 1 : 0, radius: 0.55 },\n      { id: \"screen\", x: -1, y: -0.05, load: screening ? 1 : 0, radius: 0.62 },\n      { id: \"budget\", x: -1, y: 0.55, load: analysing ? 0.5 : 0, radius: 0.6 },\n      { id: \"analysis\", x: 1, y: -0.76, load: analysing ? 1 : 0, radius: 0.55 },\n      { id: \"recon\", x: -0.55, y: 1, load: reconciling ? 1 : 0, radius: 0.6 },\n      { id: \"sync\", x: 0.55, y: 1, load: syncing ? 0.7 : 0, radius: 0.6 },\n    ].filter(p => p.load > 0);\n    this._loads = {\n      \"path-collect\": collecting ? 1 : 0,\n      \"path-screen\": screening ? 1 : 0,\n      \"path-budget\": analysing ? 0.5 : 0,\n      \"path-analysis\": analysing ? 1 : 0,\n      \"path-gate\": waiting > 0 ? 0.5 : 0,\n      \"path-approval\": waiting > 0 ? 1 : 0,\n      \"path-recon\": reconciling ? 1 : 0,\n      \"path-exec\": 0,\n      \"path-bus\": active > 0 ? Math.min(1, active / 5) : 0,\n    };\n\n    // Core color follows PROCESSING LOAD only. Approval waiting never tints the core.\n    const forced = this.props.coreLoad ?? \"live\";\n    const loadMap = { resting: 0.08, moderate: 0.45, high: 0.75, max: 1 };\n    const lift = forced === \"live\" ? Math.min(active, 5) / 5 : loadMap[forced];\n\n    // Blue -> white -> gold, routed through low chroma so it never passes through green.\n    const hue = lift < 0.5 ? 232 : 82;\n    const chroma = (0.115 * Math.abs(lift - 0.5) * 2).toFixed(3);\n    const light = (0.62 + lift * 0.3).toFixed(3);\n    const glowPx = 46 + lift * 130;\n    const glowAlpha = (0.18 + lift * 0.34).toFixed(2);\n\n    const cyan = \"#5fd8f5\";\n    const cyanDim = \"#1b4d5f\";\n    const gold = \"#f5b942\";\n    const green = \"#4ade8a\";\n\n    const play = (on) => (on && !isOpen) ? \"running\" : \"paused\";\n    const frame = (on) => on ? \"#2a6f86\" : \"#17414f\";\n    const dot = (on) => on ? cyan : \"#2a4a58\";\n\n    let cards = [\n      {\n        symbol: \"NTAP\", name: \"NetApp, Inc.\", side: \"BUY\", expiry: \"6:12\",\n        why: \"Q1 FY2027 results released after close on an 8-K item 2.02. Revenue and guidance both above the prior four-quarter trend; the move so far is 3.4 standard deviations of 20-day ATR on 6.1\\u00d7 median volume.\",\n        base: 36.2, price: 116.77, conf: \"0.61\", confNote: \"reasoning is well supported by the filing\",\n        bear: [\n          { text: \"Guidance beat is driven by a hardware refresh cycle management itself describes as pull-forward demand, not expansion. The comparable quarter a year out faces that pulled-forward base.\", cite: \"EX-99.1 L142\" },\n          { text: \"Gross margin contracted 180bp year over year despite the revenue beat, attributed to component costs the filing does not describe as transitory.\", cite: \"EX-99.1 L211\" },\n          { text: \"The post-release move has already happened. Entering now buys the reaction, not the information \\u2014 and the position cannot be exited before Wednesday.\", cite: \"\" },\n        ],\n        contra: [\n          { text: \"The same filing's cash-flow statement shows operating cash flow down 9% year over year, which does not support the growth reading the bull case rests on.\", cite: \"EX-99.1 L308\" },\n          { text: \"Two of the last three comparable item 2.02 releases for this issuer produced a same-direction move that fully reverted within four sessions.\", cite: \"\" },\n        ],\n        bull: [\n          { text: \"Revenue of $1.74bn exceeded the prior four-quarter trend by 6.2%, and the filing raises full-year guidance rather than reaffirming it.\", cite: \"EX-99.1 L88\" },\n          { text: \"All-flash array revenue grew 21% year over year, the segment the issuer has repeatedly identified as margin-accretive.\", cite: \"EX-99.1 L164\" },\n        ],\n        tax: [\n          { text: \"No realised gain or loss. This opens a new lot and starts its holding-period clock at fill.\", cost: false },\n          { text: \"No disallowed loss in NTAP inside the wash-sale window, so this purchase does not trigger one.\", cost: false },\n          { text: \"Sold before 2027-08-04 this is a short-term gain, taxed as ordinary income rather than at the long-term rate.\", cost: true },\n        ],\n        prov: \"EVENT 0F3A91C \\u00b7 $0.148 \\u00b7 T4-V1 \\u00b7 5 CITATIONS RESOLVED\",\n      },\n      {\n        symbol: \"SPY\", name: \"SPDR S&P 500 ETF\", side: \"SELL\", expiry: \"12:40\",\n        why: \"Held lot has cleared its minimum hold and settled. Exit proposed on cash-reserve rebalancing, not on a thesis change \\u2014 there is no new information about this position.\",\n        base: 20.0, price: 738.42, conf: \"0.44\", confNote: \"no new information; rationale is procedural\",\n        bear: [\n          { text: \"Selling realises a short-term gain taxed as ordinary income, and the position has been held four sessions. The tax cost may exceed the rebalancing benefit at this size.\", cite: \"\" },\n          { text: \"This is the only position in the account. Exiting it leaves the portfolio entirely in cash, which is a decision about market exposure disguised as a rebalance.\", cite: \"\" },\n        ],\n        contra: [\n          { text: \"Cash reserve is already at 96.0%, far above the 40% floor. The rebalancing rationale does not hold at the current posture.\", cite: \"\" },\n        ],\n        bull: [\n          { text: \"Realising the position now avoids carrying single-position concentration into an earnings-dense week.\", cite: \"\" },\n        ],\n        tax: [\n          { text: \"Realises a short-term gain of $0.41, taxed as ordinary income \\u2014 roughly $0.13 at a 32% marginal rate.\", cost: true },\n          { text: \"Held 4 sessions. Long-term treatment on this lot begins 2027-07-28, 361 days away.\", cost: true },\n          { text: \"Closing at a gain, so no wash-sale exposure \\u2014 repurchasing inside 30 days would not disallow anything.\", cost: false },\n        ],\n        prov: \"EVENT 7B2C04E \\u00b7 $0.000 CACHE HIT \\u00b7 T4-V1 \\u00b7 0 CITATIONS\",\n      },\n      {\n        symbol: \"AVGO\", name: \"Broadcom Inc.\", side: \"BUY\", expiry: \"21:05\",\n        why: \"8-K item 1.01 \\u2014 a material definitive agreement filed intraday. Volume 4.2\\u00d7 median with a 2.1 sigma move against a flat peer group.\",\n        base: 28.0, price: 342.15, conf: \"0.52\", confNote: \"key exhibit terms are redacted\",\n        bear: [\n          { text: \"The agreement's financial terms are redacted in the filed exhibit, so the size and duration of the commitment cannot be established from the primary source.\", cite: \"EX-10.1 L44\" },\n          { text: \"Invested capital would reach 12.8% of equity once every outstanding earmark fills, from 4.0% today.\", cite: \"\" },\n        ],\n        contra: [\n          { text: \"The move began roughly forty minutes before the filing was accepted, which is consistent with the information already being priced.\", cite: \"\" },\n        ],\n        bull: [\n          { text: \"Item 1.01 agreements from this issuer have historically preceded upward revenue guidance revisions within two quarters.\", cite: \"\" },\n        ],\n        tax: [\n          { text: \"No realised gain or loss. Opens a new lot; broker disposal is FIFO, so this lot sits behind any earlier AVGO lot on a future sale.\", cost: false },\n          { text: \"No disallowed loss in AVGO inside the wash-sale window.\", cost: false },\n        ],\n        prov: \"EVENT C41E8A2 \\u00b7 $0.151 \\u00b7 T4-V1 \\u00b7 3 CITATIONS RESOLVED\",\n      },\n    ];\n\n    // In live mode the queue is the real pending-request list. /api/state carries\n    // the request's terms but NOT its analysis payload -- no bear case, no\n    // contradictory evidence, no citations, no tax lines. §10 forbids an approve\n    // action without the bear case above it, so the live queue is read-only: rows\n    // show real terms and the card does not open. Backend gap, not a UI choice.\n    if (A) {\n      const p = (A.approvals && A.approvals.pending) || [];\n      cards = p.length ? p.map(r => ({\n        symbol: r.symbol || \"\\u2014\", name: r.request_id, side: r.side || \"\\u2014\",\n        expiry: String(Math.floor(r.seconds_until_expiry / 60)) + \":\" +\n                String(Math.floor(r.seconds_until_expiry % 60)).padStart(2, \"0\"),\n        why: \"\", base: Number(r.earmark || 0), price: Number(r.limit_price || 0),\n        conf: r.confidence === null || r.confidence === undefined ? \"\\u2014\" : String(r.confidence),\n        confNote: \"\", bear: [], contra: [], bull: [], tax: [], prov: \"\",\n      })) : [{\n        symbol: \"NONE\", name: \"\", side: \"\\u2014\", expiry: \"\\u2014\", why: \"\",\n        base: 0, price: 0, conf: \"\\u2014\", confNote: \"\",\n        bear: [], contra: [], bull: [], tax: [], prov: \"\",\n      }];\n    }\n\n    const c = isOpen ? cards[open] : cards[0];\n    const pct = this.state.sizePct;\n    const isSell = c.side === \"SELL\";\n    const limit = c.price - this.state.limitDelta * 0.05 * (isSell ? 1 : 1);\n    const notional = c.base * pct / 100;\n    const equity = 500.0;\n    const held = 20.0;\n    const invested = isSell ? Math.max(0, held - notional) : held + notional;\n    // Every OTHER pending buy's earmark is assumed filled, so no card's figures\n    // change when a sibling is approved.\n    const otherEarmarks = cards.reduce((sum, o, i) => sum + ((i !== open && o.side === \"BUY\") ? o.base : 0), 0);\n\n    const shown = isOpen ? t - this.state.cardShownAt : 0;\n    const remaining = Math.max(0, minSec - shown);\n    const ready = remaining === 0;\n    const mm = String(Math.floor(shown / 60)).padStart(2, \"0\");\n    const ss = String(shown % 60).padStart(2, \"0\");\n    const modified = pct !== 100 || this.state.limitDelta !== 0;\n\n    const selBg = (on) => on ? \"#cfe3ec\" : \"none\";\n    const selFg = (on) => on ? \"#050b12\" : \"#a8c6d6\";\n    const selBd = (on) => on ? \"#cfe3ec\" : \"#2a4a58\";\n\n    const clock = new Date(Date.UTC(2026, 7, 2, 15, 32, 42 + t)).toISOString().slice(11, 19);\n    const cycle = 300 - (t * 7) % 300;\n\n    const D = this.state.drawer;\n    const panels = {\n      p1: {\n        num: \"01\", title: \"Data collection\", source: \"agent/collectors/ \\u00b7 agent/pipeline_stage.py \\u00b7 §3.1\",\n        rows: [\n          { k: \"Market bars ingested today\", v: (1284 + (t % 9) * 3) + \"\", fg: \"#cfe3ec\" },\n          { k: \"Filings seen today\", v: \"17\", fg: \"#cfe3ec\" },\n          { k: \"Deduped by accession number\", v: \"4 skipped\", fg: \"#6a8798\" },\n          { k: \"EDGAR rate limiter\", v: \"10 req/s ENFORCED\", fg: \"#4ade8a\" },\n          { k: \"Last collection cycle\", v: \"42s ago\", fg: \"#5fd8f5\" },\n        ],\n        fields: [\n          { label: \"Collection enabled\", value: \"TRUE\", key: \"data_collection_enabled\", tag: \"LIVE\", note: \"Master switch for the collection stage. Off means no bars and no filings enter the store.\" },\n          { label: \"Collection interval\", value: \"300 s\", key: \"data_collection_interval_seconds\", tag: \"\", note: \"Wall-clock gap between cycles. The run loop is single-threaded, so cycles cannot overlap regardless of this value.\" },\n          { label: \"Session gate\", value: \"IN SESSION ONLY\", key: \"(derived)\", tag: \"READ ONLY\", note: \"Collection runs only inside a real trading session, from market_calendar. Not configurable here.\" },\n          { label: \"News feed\", value: \"NOT BUILT\", key: \"\\u2014\", tag: \"ABSENT\", note: \"No news collector exists. Listed so the gap is visible rather than implied.\" },\n        ],\n        warn: \"Raising the cadence increases EDGAR requests but not model spend \\u2014 collection never calls a model.\", tone: \"info\",\n        footer: \"NO RESTART REQUIRED \\u00b7 PICKED UP NEXT CYCLE\", save: \"Apply\",\n      },\n      p2: {\n        num: \"02\", title: \"Materiality screen\", source: \"agent/materiality.py \\u00b7 agent/opportunity_event_tracker.py \\u00b7 §3.2\",\n        rows: [\n          { k: \"Scored this session\", v: (41 + (t % 5)) + \"\", fg: \"#cfe3ec\" },\n          { k: \"Suppressed below threshold\", v: (38 + (t % 5)) + \"\", fg: \"#6a8798\" },\n          { k: \"Triggered analysis\", v: \"3\", fg: \"#f5b942\" },\n          { k: \"Dedup identity\", v: \"event_id\", fg: \"#cfe3ec\" },\n          { k: \"Deferred, eligible next session\", v: \"1 \\u00b7 insufficient cash\", fg: \"#f5b942\" },\n        ],\n        fields: [\n          { label: \"Screen enabled\", value: \"TRUE\", key: \"materiality_screen_enabled\", tag: \"LIVE\", note: \"Scoring is free. Turning this off stops anything reaching analysis at all.\" },\n          { label: \"Screen interval\", value: \"5 min\", key: \"opportunity_screen_interval_minutes\", tag: \"\", note: \"How often unhandled events are rescored. Converted to seconds at the call site.\" },\n          { label: \"Materiality threshold\", value: \"0.62\", key: \"materiality_threshold\", tag: \"UNCALIBRATED\", note: \"The single number standing between a filing and paid analysis. Placeholder weights until ~60 sessions of outcomes exist.\" },\n          { label: \"Filing weight table\", value: \"FLAT 1.0\", key: \"filing_weight\", tag: \"STUB\", note: \"§3.2 specifies a per-form table; the code returns 1.0 for every form. An 8-K and a 10-K currently score identically.\" },\n        ],\n        warn: \"Lowering the threshold spends money: every extra trigger is a paid model call against the daily cap and the monthly budget.\", tone: \"warn\",\n        footer: \"TAKES EFFECT NEXT SCREEN CYCLE\", save: \"Apply\",\n      },\n      p3: {\n        num: \"03\", title: \"Cost brake\", source: \"agent/cost_ledger.py \\u00b7 §4.3\",\n        rows: [\n          { k: \"Spent month to date\", v: \"$3.42\", fg: \"#cfe3ec\" },\n          { k: \"Analyses today\", v: \"4 of 8\", fg: \"#cfe3ec\" },\n          { k: \"Mean cost per analysis\", v: \"$0.149\", fg: \"#cfe3ec\" },\n          { k: \"Cache hits (free)\", v: \"6\", fg: \"#4ade8a\" },\n          { k: \"Projected at daily cap\", v: \"$25.10\", fg: \"#f5b942\" },\n        ],\n        fields: [\n          { label: \"T4 analysis enabled\", value: \"FALSE\", key: \"t4_analysis_enabled\", tag: \"SPEND SWITCH\", note: \"The only flag that causes money to be spent. False on this branch; you set it deliberately.\" },\n          { label: \"Monthly target\", value: \"$20.00\", key: \"monthly_cost_target_usd\", tag: \"\", note: \"Soft line. Crossing it is reported, not enforced.\" },\n          { label: \"Monthly hard stop\", value: \"$30.00\", key: \"monthly_cost_hard_stop_usd\", tag: \"HALTS AGENT\", note: \"At this figure the agent stops analysing entirely for the rest of the month. Not a warning.\" },\n          { label: \"Analyses per day\", value: \"8\", key: \"max_model_analyses_per_day\", tag: \"\", note: \"Hard daily ceiling on paid calls, independent of the monthly figures.\" },\n        ],\n        warn: \"Raising the hard stop removes the only automatic brake on model spend. The ledger is durable, so restarts do not reset it.\", tone: \"warn\",\n        footer: \"HARD STOP CHANGE REQUIRES RE-AUTH\", save: \"Re-auth and apply\",\n      },\n      p4: {\n        num: \"04\", title: \"Analysis\", source: \"agent/analysis.py \\u00b7 agent/extraction_cache_store.py \\u00b7 §5\",\n        rows: [\n          { k: \"Current document\", v: \"NTAP 8-K item 2.02\", fg: \"#cfe3ec\" },\n          { k: \"Cost of this call\", v: \"$0.148\", fg: \"#cfe3ec\" },\n          { k: \"Refused for unsupported claim\", v: \"1 today\", fg: \"#f5b942\" },\n          { k: \"Citations resolved\", v: \"5 of 5\", fg: \"#4ade8a\" },\n          { k: \"Prompt isolation\", v: \"FILING TEXT NEVER INSTRUCTIONS\", fg: \"#4ade8a\" },\n        ],\n        fields: [\n          { label: \"Model\", value: \"T4-V1\", key: \"analysis_model\", tag: \"\", note: \"Frontier model used for document reasoning. Changing it invalidates cached extractions.\" },\n          { label: \"Require citations\", value: \"TRUE\", key: \"require_citations\", tag: \"INVARIANT\", note: \"Every claim must cite a line in the source document or the analysis is refused. Do not turn this off.\" },\n          { label: \"Extraction cache\", value: \"SHARED\", key: \"--extraction-cache-path\", tag: \"CLI FLAG\", note: \"Shared across accounts, not per-account, consistent with the cost ledger. A cache hit costs nothing.\" },\n          { label: \"Refuse on thin evidence\", value: \"TRUE\", key: \"refuse_unsupported\", tag: \"INVARIANT\", note: \"A refusal is a successful outcome. It is the behaviour that keeps the agent from inventing a thesis.\" },\n        ],\n        warn: \"Citation and refusal requirements are the reason this agent can be trusted with primary sources. Treat them as structural, not tunable.\", tone: \"warn\",\n        footer: \"MODEL CHANGE CLEARS THE EXTRACTION CACHE\", save: \"Apply\",\n      },\n      p5: {\n        num: \"05\", title: \"Risk gates\", source: \"agent/risk.py \\u00b7 agent/gatekeeper.py \\u00b7 §6\",\n        rows: [\n          { k: \"Cash reserve\", v: \"96.0% \\u00b7 floor 40%\", fg: \"#4ade8a\" },\n          { k: \"Max position\", v: \"25% of equity\", fg: \"#cfe3ec\" },\n          { k: \"Day trades used\", v: \"0 of 3\", fg: \"#4ade8a\" },\n          { k: \"Minimum hold\", v: \"1 session \\u00b7 T+1 settled\", fg: \"#cfe3ec\" },\n          { k: \"Gate composition\", v: \"ALL MUST PASS \\u00b7 NO OVERRIDE\", fg: \"#4ade8a\" },\n        ],\n        fields: [\n          { label: \"Cash reserve floor\", value: \"40%\", key: \"min_cash_reserve_pct\", tag: \"GATE\", note: \"Orders are resized to respect this, and refused outright if the full request will not fit.\" },\n          { label: \"Max position size\", value: \"25%\", key: \"max_position_pct\", tag: \"GATE\", note: \"Ceiling per symbol as a share of equity. Resizing happens on this dimension.\" },\n          { label: \"Risk preset\", value: \"MODERATE\", key: \"risk_preset\", tag: \"\", note: \"CONSERVATIVE, MODERATE, or AGGRESSIVE. AGGRESSIVE is unloadable under pilot defaults: its 4-hour hold is sub-day and the cash posture forbids it.\" },\n          { label: \"Override behaviour\", value: \"REJECT\", key: \"(code)\", tag: \"READ ONLY\", note: \"An override beyond platform maximum is rejected, never clamped. §6 previously said clamped; the code was right.\" },\n        ],\n        warn: \"       footer: \"REQUIRES RE-AUTH \\u00b7 AUDITED\", save: \"Re-auth and apply\",\n      },\n      p7: {\n        num: \"07\", title: \"Reconciliation\", source: \"agent/reconcile.py \\u00b7 §8.1\",\n        rows: [\n          { k: \"Positions\", v: \"SPY 0.0271\", fg: \"#cfe3ec\" },\n          { k: \"Settled cash\", v: \"$480.00\", fg: \"#cfe3ec\" },\n          { k: \"Open orders\", v: \"NONE\", fg: \"#4ade8a\" },\n          { k: \"Day-trade count\", v: \"0 \\u00b7 BROKER FIGURE UNKNOWN\", fg: \"#f5b942\" },\n          { k: \"Last result\", v: \"4 of 4 CLEAN\", fg: \"#4ade8a\" },\n        ],\n        fields: [\n          { label: \"Reconcile interval\", value: \"300 s\", key: \"reconciliation_cycle_interval_seconds\", tag: \"\", note: \"Broker truth is pulled on this cadence and always wins over local state.\" },\n          { label: \"On divergence\", value: \"HALT AND REPORT\", key: \"reconcile_on_divergence\", tag: \"INVARIANT\", note: \"The agent stops rather than trading against a position it cannot confirm.\" },\n          { label: \"Broker\", value: \"ALPACA PAPER\", key: \"broker_env\", tag: \"PAPER\", note: \"Switching to live is a mode transition, not a config edit. It requires re-auth and explicit confirmation.\" },\n        ],\n        warn: \"The broker's own day-trade count is not exposed by the paper API, so the local figure is a lower bound. Treat 0 of 3 as unverified.\", tone: \"warn\",\n        footer: \"NO RESTART REQUIRED\", save: \"Apply\",\n      },\n      p8: {\n        num: \"08\", title: \"Audit chain\", source: \"agent/audit_log.py \\u00b7 §8.2\",\n        rows: [\n          { k: \"Rows today\", v: \"148\", fg: \"#cfe3ec\" },\n          { k: \"Hash chain\", v: \"VERIFIED TO GENESIS\", fg: \"#4ade8a\" },\n          { k: \"Write mode\", v: \"APPEND-ONLY \\u00b7 FSYNC PER ROW\", fg: \"#4ade8a\" },\n          { k: \"Truncated-tail handling\", v: \"UNSTARTABLE \\u00b7 KNOWN DEFECT\", fg: \"#ff6b5a\" },\n          { k: \"Retention\", v: \"FOREVER  \"Apply\",\n      },\n      p10: {\n        num: \"10\", title: \"Performance evaluation\", source: \"§13 \\u00b7 not implemented\",\n        rows: [\n          { k: \"Closed positions\", v: \"0\", fg: \"#6a8798\" },\n          { k: \"Sessions\", v: \"1 of 60\", fg: \"#6a8798\" },\n          { k: \"Benchmark\", v: \"VS INDEX \\u00b7 NET OF TAX\", fg: \"#cfe3ec\" },\n          { k: \"Attribution layer\", v: \"ABSENT\", fg: \"#ff6b5a\" },\n        ],\n        fields: [\n          { label: \"Benchmark symbol\", value: \"SPY\", key: \"benchmark_symbol\", tag: \"\", note: \"Beating this net of tax and fees is the only success criterion that matters.\" },\n          { label: \"Kill criterion\", value: \"REVIEWED IN 11 MONTHS\", key: \"kill_review_date\", tag: \"\", note: \"Set at pilot start. Underperforming the benchmark at review means the pilot ends \\u2014 that is the point of naming it in advance.\" },\n        ],\n        warn: \"Until this panel reports real numbers the agent cannot tell you whether any decision it made was good. This is the highest-value thing left to build.\", tone: \"warn\",\n        footer: \"NOTHING TO APPLY YET\", save: \"Apply\",\n      },\n      p11: {\n        num: \"11\", title: \"Execution\", source: \"agent/broker/base.py \\u00b7 §7\",\n        rows: [\n          { k: \"Broker\", v: \"ALPACA PAPER\", fg: \"#5fd8f5\" },\n          { k: \"Open orders\", v: \"NONE\", fg: \"#4ade8a\" },\n          { k: \"Funding\", v: \"SETTLED CASH \\u00b7 T+1\", fg: \"#cfe3ec\" },\n          { k: \"Unsettled cash funding\", v: \"DISABLED\", fg: \"#6a8798\" },\n          { k: \"Token requirement\", v: \"SIGNED TOKEN OR NO ORDER\", fg: \"#4ade8a\" },\n        ],\n        fields: [\n          { label: \"Funding source\", value: \"SETTLED_CASH\", key: \"funding_source\", tag: \"GATE\", note: \"Cash account. Sale proceeds are unsettled for one session, so a sell cannot fund a same-day buy.\" },\n          { label: \"Order type\", value: \"LIMIT\", key: \"default_order_type\", tag: \"\", note: \"Market orders are not used. The limit is what the price band is enforced against.\" },\n          { label: \"Price band\", value: \"\\u00b10.85%\", key: \"price_band_pct\", tag: \"GATE\", note: \"Price leaving this band voids the token rather than repricing it. Currently recomputed at mint instead of inherited from the request \\u2014 open defect.\" },\n          { label: \"Cancel and replace\", value: \"TOKEN REQUIRED\", key: \"(code)\", tag: \"READ ONLY\", note: \"CANCEL, CLOSE and REPLACE are order kinds through the gatekeeper. There is no ungated write path to the broker.\" },\n        ],\n        warn: \"Widening the price band means approving a figure further from the one you actually read. The band is the link between the analysis and the fill.\", tone: \"danger\",\n        footer: \"REQUIRES RE-AUTH \\u00b7 AUDITED\", save: \"Re-auth and apply\",\n      },\n      core: {\n        num: \"\\u2014\", title: \"Processing load\", source: \"agent/run_loop.py \\u00b7 agent/mode.py \\u00b7 §9\",\n        rows: [\n          { k: \"Agent mode\", v: \"PAPER\", fg: \"#f5b942\" },\n          { k: \"Processes active\", v: active + \" of 6\", fg: \"#cfe3ec\" },\n          { k: \"Core visual reflects\", v: \"PROCESSING LOAD\", fg: \"#5fd8f5\" },\n          { k: \"Loop cadence\", v: \"SINGLE-THREADED \\u00b7 NO OVERLAP\", fg: \"#4ade8a\" },\n          { k: \"Uptime\", v: \"1 session\", fg: \"#cfe3ec\" },\n        ],\n        fields: [\n          { label: \"Mode\", value: \"PAPER\", key: \"mode\", tag: \"5 STATES\", note: \"RESEARCH, PAPER, PRODUCTION_PENDING, PAUSED, PRODUCTION_ACTIVE. Resuming from PAUSED to PRODUCTION_ACTIVE requires re-auth: resuming is starting live trading.\" },\n          { label: \"Loop interval\", value: \"60 s\", key: \"run_loop_interval_seconds\", tag: \"\", note: \"Outer cadence. Each stage has its own interval inside it.\" },\n          { label: \"Kill switch\", value: \"ARMED\", key: \"(operator)\", tag: \"ALWAYS ON\", note: \"Pause halts the loop between cycles. It never interrupts a submitted order \\u2014 that is the broker's to resolve.\" },\n        ],\n        warn: \"Gold in the core means the agent is working hard, not that it needs you. Human attention is signalled by the amber frame on panel 06 alone.\", tone: \"info\",\n        footer: \"MODE TRANSITION REQUIRES RE-AUTH AND CONFIRMATION\", save: \"Re-auth and apply\",\n      },\n    };\n    // Live overrides, applied by label so the panel definitions above stay the\n    // single source of layout and copy. Anything with no override keeps its sample\n    // value -- and the header pill is what tells the operator which is which.\n    if (A) {\n      const R = {\n        \"Market bars ingested today\": fig(A.data_collection, \"bars_ingested_today\"),\n        \"Filings seen today\": fig(A.data_collection, \"filings_ingested_today\"),\n        \"Scored this session\": fig(A.materiality_screen, \"scored_this_session\"),\n        \"Suppressed below threshold\": fig(A.materiality_screen, \"suppressed_this_session\"),\n        \"Triggered analysis\": fig(A.materiality_screen, \"triggered_this_session\"),\n        \"Day trades used\": fig(A.reconciliation, \"day_trade_count\", v => v + \" of 3\"),\n        \"Hash chain\": { v: A.audit.hash_chain_verified ? \"VERIFIED TO GENESIS\" : \"BROKEN\",\n                        fg: A.audit.hash_chain_verified ? \"#4ade8a\" : \"#ff6b5a\", why: \"\" },\n        \"Rows today\": { v: String(A.audit.recent.length) + \" READ\", fg: \"#cfe3ec\", why: \"\" },\n        \"Closed positions\": fig(A.performance, \"closed_positions\"),\n        \"Sessions recorded\": fig(A.improvement_loop, \"sessions_recorded\"),\n        \"Attribution layer\": fig(A.performance, \"attribution\"),\n        \"Class A \\u00b7 reading quality\": fig(A.improvement_loop, \"class_a_reading_quality_labels\"),\n        \"Class B \\u00b7 decision quality\": fig(A.improvement_loop, \"class_b_decision_quality_history\"),\n        \"Mode\": { v: String(A.mode).toUpperCase(), fg: \"#f5b942\", why: \"\" },\n        \"Cash reserve\": fig(A.risk_gates, \"current_reserve_pct\", v => Number(v).toFixed(1) + \"%\"),\n        \"Investable cash\": fig(A.risk_gates, \"investable_cash_usd\", usd),\n        \"Required reserve\": fig(A.risk_gates, \"required_reserve_usd\", usd),\n        \"Month to date\": { v: usd(A.cost.month_to_date_usd), fg: \"#cfe3ec\", why: \"\" },\n        \"Analyses today\": { v: A.cost.analyses_today + \" of \" + A.cost.max_model_analyses_per_day,\n                            fg: \"#cfe3ec\", why: \"\" },\n        \"Cache hit rate\": { v: (Number(A.cost.cache_hit_rate) * 100).toFixed(0) + \"%\", fg: \"#cfe3ec\", why: \"\" },\n        \"Currently analysing\": fig(A.analysis, \"currently_analyzing\"),\n        \"Current document\": fig(A.analysis, \"currently_analyzing\"),\n        \"Cost of this call\": { v: \"UNAVAILABLE\", fg: \"#6a8798\", why: \"\" },\n        \"Refused for unsupported claim\": { v: \"UNAVAILABLE\", fg: \"#6a8798\", why: \"\" },\n        \"Waiting for you\": { v: String(waiting), fg: \"#f5b942\", why: \"\" },\n        \"Decided today\": { v: A.approvals.decided_today + \" of \" + A.approvals.max_approval_requests_per_day + \" cap\", fg: \"#cfe3ec\", why: \"\" },\n        \"Cash earmarked\": fig(A.approvals, \"outstanding_earmarks_usd\", usd),\n        \"Deferred for cash\": { v: \"UNAVAILABLE\", fg: \"#6a8798\", why: \"\" },\n        \"Positions\": { v: \"NOT SUPPLIED\", fg: \"#6a8798\", why: \"\" },\n        \"Settled cash\": { v: \"NOT SUPPLIED\", fg: \"#6a8798\", why: \"\" },\n        \"Day-trade count\": fig(A.reconciliation, \"day_trade_count\", v => v + \" \\u00b7 BROKER FIGURE UNVERIFIED\"),\n        \"Max position\": { v: asPct(A.risk_gates.max_position_pct) + \" of equity\", fg: \"#cfe3ec\", why: \"\" },\n      };\n      const F = {\n        \"Collection enabled\": flag(A.data_collection.enabled),\n        \"Collection interval\": { v: A.data_collection.interval_seconds + \" s\" },\n        \"Screen enabled\": flag(A.materiality_screen.enabled),\n        \"Screen interval\": { v: Math.round(A.materiality_screen.interval_seconds / 60) + \" min\" },\n        \"Materiality threshold\": { v: String(A.materiality_screen.threshold) },\n        \"Monthly target\": { v: usd(A.cost.monthly_budget_usd) },\n        \"Monthly hard stop\": { v: usd(A.cost.budget_hard_stop_usd) },\n        \"Analyses per day\": { v: String(A.cost.max_model_analyses_per_day) },\n        \"Model\": { v: String(A.analysis.model_id) },\n        \"Cash reserve floor\": { v: asPct(A.risk_gates.minimum_settled_cash_pct_of_nlv) },\n        \"Max position size\": { v: asPct(A.risk_gates.max_position_pct) },\n        \"Reconcile interval\": { v: A.reconciliation.cycle_interval_seconds + \" s\" },\n        \"Price band\": { v: \"\\u00b1\" + asPct(A.approvals.price_band_pct) },\n        \"Loop enabled\": flag(A.improvement_loop.enabled),\n        \"Mode\": { v: String(A.mode).toUpperCase() },\n      };\n      Object.keys(panels).forEach(pk => {\n        panels[pk].rows = panels[pk].rows.map(r => {\n          const o = R[r.k];\n          return o ? { k: r.k, v: o.v, fg: o.fg || r.fg } : r;\n        });\n        panels[pk].fields = panels[pk].fields.map(f => {\n          const o = F[f.label];\n          return o ? Object.assign({}, f, { value: o.v }) : f;\n        });\n      });\n    }\n\n    const d = D ? panels[D] : null;\n    const toneMap = {\n      info: { bar: \"#2b9fc4\", bg: \"rgba(11,24,37,0.8)\", fg: \"#a8c6d6\" },\n      warn: { bar: \"#f5b942\", bg: \"rgba(26,21,8,0.8)\", fg: \"#e6d5ad\" },\n      danger: { bar: \"#ff6b5a\", bg: \"rgba(38,12,10,0.8)\", fg: \"#f0c4bc\" },\n    };\n    const tone = d ? toneMap[d.tone] : toneMap.info;\n    const gatedTag = (tag) => tag === \"GATE\" || tag === \"INVARIANT\" || tag === \"SPEND SWITCH\" || tag === \"HALTS AGENT\" || tag === \"FRICTION\";\n    const openDrawer = (k) => (e) => { if (e && e.       { name: \"Positions\", value: \"SPY 0.0271\" },\n        { name: \"Settled cash\", value: \"$480.00\" },\n        { name: \"Open orders\", value: \"NONE\" },\n        { name: \"Day trades\", value: \"0 · UNKNOWN\" },\n      ],\n      nextCycle: String(Math.floor(cycle / 60)) + \":\" + String(cycle % 60).padStart(2, \"0\"),\n\n      auditRows: A ? (A.audit.recent.length\n        ? A.audit.recent.slice(-5).reverse().map(ev => ({\n            t: String(ev.timestamp).slice(11, 16),\n            what: ev.action + (ev.object_id ? \" \" + ev.object_id : \"\"),\n          }))\n        : [{ t: \"\\u2014\", what: \"no audit rows yet\" }]) : [\n        { t: clock.slice(0, 5), what: \"materiality_screened\" },\n        { t: \"15:31\", what: \"analysis_completed NTAP\" },\n        { t: \"15:29\", what: \"approval_requested AVGO\" },\n        { t: \"15:26\", what: \"cash_adjustment FEE\" },\n        { t: \"15:20\", what: \"reconcile 4/4 clean\" },\n      ],\n\n      queue: cards.map((q, i) => ({\n        symbol: q.symbol, side: q.side, expiry: \"EXP \" + q.expiry,\n        sideFg: q.side === \"BUY\" ? green : \"#f5a04a\",\n        expiryFg: i === 0 ? gold : \"#8f7a45\",\n        bg: i === 0 ? \"rgba(245,185,66,0.1)\" : \"rgba(6,13,21,0.7)\",\n        border: i === 0 ? \"#6b5216\" : \"#22303a\",\n        open: (e) => {\n          if (e && e.stopPropagation) e.stopPropagation();\n          if (A) return; // no analysis payload from /api/state -> no approve surface\n          this.setState({ open: i, sizePct: 100, limitDelta: 0, cardShownAt: this.state.t, drawer: null });\n        },\n      })),\n\n      modalOpen: isOpen,\n      closeModal: () => this.setState({ open: null }),\n\n      cardConf: c.conf, cardConfNote: c.confNote,\n      cardSymbol: c.symbol, cardName: c.name, cardSide: c.side, cardWhy: c.why,\n      cardExpiry: c.expiry, cardProvenance: c.prov,\n      cardSideBg: isSell ? \"#f5a04a\" : green,\n      bearPoints: c.bear, contraPoints: c.contra, bullPoints: c.bul
